[package]
name = "arlecchino"
version = "1.0.0"
edition = "2021"
description = "Meta-decompiler and J2ME port toolkit: multi-decompiler best-of merge, auto-fix, round-trip, FreeJ2ME emulation."
authors = ["Wehrwolfmann"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["decompiler", "java", "j2me", "midp", "meta-decompilation"]
repository = "https://github.com/wehrwolfmann/arlecchino"

[[bin]]
name = "arlecchino"
path = "src/main.rs"

[[bin]]
name = "arlecchino-gui"
path = "src/bin/arlecchino-gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["tls", "json"] }

# GUI frontend — optional; the CLI library/binary build without these.
eframe = { version = "0.31", optional = true }
egui_extras = { version = "0.31", optional = true }
ksni = { version = "0.2", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui_extras"]
tray = ["dep:ksni"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
