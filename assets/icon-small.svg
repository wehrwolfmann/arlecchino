<!-- Arlecchino application icon - small-size build (16/24 px).
     Same design as assets/icon.svg with the engraving stripped and the eye holes
     and lozenge enlarged: below ~32 px a whole ornament falls under one pixel and
     would only muddy the silhouette. Self-contained SVG: no raster data, no fonts,
     no external references. -->
