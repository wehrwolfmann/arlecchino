# Default engine configuration for Arlecchino.
#
# `engines_root` is where `arlecchino setup` downloads engines.  Relative `path`
# values below are resolved against it.  You can also point `path` at an absolute
# location (e.g. an existing local copy) — see ~/.arlecchino/engines.toml.
#
# Override by copying this file to ~/.arlecchino/engines.toml or ./arlecchino.toml
# and editing it, or pass --config PATH.

engines_root = "~/.arlecchino/engines"

[[engine]]
name = "vineflower"
type = "names"
kind = "jar"
path = "vineflower.jar"
args = ["{jar}", "{out}"]

[[engine]]
name = "cfr"
type = "names"
kind = "jar"
path = "cfr.jar"
args = ["{jar}", "--outputdir", "{out}",
        "--renamedupmembers", "true", "--renameillegalidents", "true",
        "--silent", "true"]

[[engine]]
name = "procyon"
type = "names"
kind = "jar"
path = "procyon.jar"
args = ["-jar", "{jar}", "-o", "{out}"]

# jadx keeps the original short class names (a, b, ... o) but wraps default-package
# classes in a `defpackage` package and renames *colliding* fields.  The "jadx"
# normalizer un-wraps `defpackage` so its output merges with the canonical tree.
[[engine]]
name = "jadx"
type = "names"
kind = "tool"
path = "jadx/bin/jadx"
args = ["--no-res", "-d", "{out}", "{jar}"]
sources_subdir = "sources"
normalize = "jadx"

# ── engines added for decompiler diversity (the paper evaluated 8) ─────────────

# JD-Core, via the jd-cli command-line front-end.  `-od` writes a flat directory of
# .java (default-package classes land at the top level, matching the other engines).
[[engine]]
name = "jd-core"
type = "names"
kind = "jar"
path = "jd-cli.jar"
args = ["{jar}", "-od", "{out}"]

# Jode (1.1.2-pre1, 2001).  Ancient, but its decompiler front-end still runs on a
# modern JDK; it keeps the original class names and writes a flat tree with `-d`.
[[engine]]
name = "jode"
type = "names"
kind = "class"
path = "jode.jar"
args = ["jode.decompiler.Main", "-d", "{out}", "{jar}"]

# Fernflower — the ORIGINAL JetBrains engine, standalone, as distinct from the
# Vineflower fork above (it is the substitute for Krakatau; see setup notes).  It
# packs a jar input into `<out>/<input>.jar`, so `normalize = "unjar"` unpacks the
# .java back onto the shared tree.
[[engine]]
name = "fernflower"
type = "names"
kind = "class"
path = "fernflower.jar"
args = ["org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler", "{jar}", "{out}"]
normalize = "unjar"

# Dava — the Soot decompiler back-end.  `-f dava` emits .java under `<out>/dava/src`.
# Kept faithful to the paper; note Dava aborts on some obfuscated bytecode (a known
# Soot bug) — when it does it simply produces no fragments and the merge proceeds.
[[engine]]
name = "dava"
type = "names"
kind = "jar"
path = "soot.jar"
args = ["-f", "dava", "-allow-phantom-refs", "-pp", "-d", "{out}", "-process-dir", "{jar}"]
sources_subdir = "dava/src"
