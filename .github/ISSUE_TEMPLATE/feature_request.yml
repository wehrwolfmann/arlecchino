name: Feature request
description: Suggest a new feature, decompiler or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do
      description: Describe the task or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links to a decompiler, a paper, an example jar under a free license…
